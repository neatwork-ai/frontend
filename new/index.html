<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <!-- You can insert your company logo image here -->
            <img src="path-to-your-logo.png" alt="Company Logo">
        </div>
        <div class="nav-buttons">
            <button onclick="location.href='#home'">Home</button>
            <button onclick="location.href='#about'">About</button>
            <button onclick="location.href='#careers'">Careers</button>
        </div>
    </nav>
    
    <!-- Horizontal cards -->
    <div class="card-container">
        <div class="card">Card 1 Content</div>
        <div class="card">Card 2 Content</div>
        <div class="card">Card 3 Content</div>
    </div>
</body>
</html>
